<div>
  <h2>{{ id ? 'Editar mantenimiento' : 'Nuevo mantenimiento' }}</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-row">
      <label>Machine ID<div class="small"><input formControlName="machineId" type="number" /></div></label>
    </div>

    <div class="form-row">
      <label style="flex:1">Título
        <input formControlName="title" type="text" />
      </label>
    </div>

    <div class="form-row">
      <label style="flex:1">Descripción
        <textarea formControlName="description" rows="3"></textarea>
      </label>
    </div>

    <div class="form-row">
      <label>Fecha programada
        <input formControlName="scheduledDate" type="date" />
      </label>

      <label>Estado
        <select formControlName="status">
          <option value="PENDING">PENDING</option>
          <option value="SCHEDULED">SCHEDULED</option>
          <option value="IN_PROGRESS">IN_PROGRESS</option>
          <option value="DONE">DONE</option>
          <option value="CANCELLED">CANCELLED</option>
        </select>
      </label>

      <label>Costo
        <input formControlName="cost" type="number" step="0.01" />
      </label>
    </div>

    <div style="display:flex; gap:8px;">
      <button type="submit">{{ id ? 'Actualizar' : 'Crear' }}</button>
      <a routerLink="/"><button type="button">Cancelar</button></a>
    </div>
  </form>
</div>
